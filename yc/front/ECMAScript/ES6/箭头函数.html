      // 1.this 是静态的，this始终指向函数声明时所在作用域下的this的值
      function getName() {
        console.log(this.name);
      }

      let getName2 = () => {
        console.log(this.name);
      };

      window.name = "杨程";
      const USER = {
        name: "yangcheng",
      };

      getName(); //杨程
      getName2(); //杨程

      getName.call(USER); //yangcheng
      getName2.call(USER); //杨程

      // 2. 不能作为构造实例化对象
      // 3. 不能使用 arguments 变量 (保存实参)
